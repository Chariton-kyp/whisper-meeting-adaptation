[project]
name = "meeting-asr"
version = "0.1.0"
description = "Adaptation and evaluation of ASR models on meeting audio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14",
    "transformers>=4.57",
    "peft>=0.17",
    "accelerate>=1.10",
    "datasets>=4.0",
    "soundfile>=0.13",
    "jiwer>=4.0",
    "huggingface-hub>=0.35",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_asr"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
